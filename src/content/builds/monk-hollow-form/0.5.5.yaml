  # ------------------------------------------------------------ MAPAS INICIAIS
  - id: mapas-iniciais
    levels: [60, 80]
    title: Setup do Scorpius — Early Endgame
    stagePt: Mapas T1–T11
    source: scorpius
    filter: t1-5
    summaryPt: >-
      Entra no setup de endgame do Scorpius: volta a usar cajado (Nazir's Judgement → rare/Duality), Hollow Focus
      volta como 3ª ascensão com suportes utilitários (Blind II, Culling Strike II) e o Spirit vira 3 auras
      defensivas + Charge Regulation + Blasphemy (Temporal Chains). A árvore faz respec: sai o Hollow Palm.
    goalsPt:
      - Respec da árvore pro PoB do Scorpius (sai Hollow Palm, entra cajado).
      - 3ª ascensão → Hollow Focus Technique.
      - Spirit no Amuleto + Peitoral pra rodar as auras.
      - Weapon Set 1 (vermelho) = cajado; Weapon Set 2 (verde) = talismã com nodes de duração pro Devour/Rend.
    skills:
      - gem: hollow-form
        supports: [whirling-assault, mobility, blindside, magnified-area-ii]
        level: 18
        role: main
        notePt: "Mobility = clear mais rápido; Magnified Area II = área dos clones (futuro: Vorana's Siege); Blindside = dano contra cego (o Blind vem do Hollow Focus)."
      - gem: hollow-focus
        supports: [magnified-area-ii, culling-strike-ii, blind-ii, cooldown-recovery-ii]
        level: 18
        role: utility
        notePt: Sinos ao redor que os clones destroem, aplicando os suportes (cegueira, culling).
      - gem: rend
        supports: [perpetual-charge, rapid-attacks-ii, prolonged-duration-ii, rage-iii]
        level: 18
        slotPt: Weapon Set 2 (Talismã)
        role: buff
        notePt: Gasta Power Charge por buff de dano. Precisa de talismã no Weapon Set 2.
      - gem: devour
        supports: [charge-profusion-ii, thrill-of-the-kill, prolonged-duration-i]
        level: 12
        slotPt: Weapon Set 2 (Talismã)
        role: utility
        notePt: Funciona em cadáveres E nos sinos do Hollow Focus — cargas manuais quando faltar.
      - gem: pounce
        supports: [rapid-attacks-i, mark-for-death]
        level: 12
        slotPt: Weapon Set 2 (Talismã)
        role: movement
        notePt: Sempre pule no chefe antes da luta pra aplicar a marca.
      - gem: frost-wall
        supports: [rapid-casting-ii, spell-cascade, glacier]
        level: 14
        role: boss
        optional: true
        notePt: Opcional pra chefe — paredes em volta do chefe que os clones quebram causando dano.
    spirit:
      - gem: wind-dancer
        supports: [maim, blind-i]
        level: 15
        role: defense
      - gem: ghost-dance
        supports: [cooldown-recovery-ii]
        level: 12
        role: defense
      - gem: convalescence
        supports: [prolonged-duration-ii, second-wind-iii, cooldown-recovery-i]
        level: 13
        role: defense
      - gem: charge-regulation
        supports: [clarity-i]
        level: 14
        role: buff
      - gem: blasphemy
        supports: [temporal-chains, slow-potency, magnified-area-i, focused-curse, ritualistic-curse]
        level: 14
        role: curse
        notePt: Temporal Chains deixa tudo lento. Alternativa pra clear — Temporal Chains + Repulsion.
    items:
      - item: nazirs-judgement
        required: true
        whyPt: Cajado de entrada — dano físico alto e barato. Com Farrul's Rune of the Hunt o requisito sobe pro 50.
        craftPt: 2× Greater Iron Rune
      - item: lochtonial-caress
        required: true
        whyPt: Obrigatória — ativa o ciclo de cargas com Way of the Stonefist. Mire em ~9–10% de chance por carga.
      - item: amor-mandragora
        whyPt: Talismã do Weapon Set 2 (Rend, Devour, Pounce precisam de talismã).
      - item: transcendent-mana-flask
        whyPt: Recuperação de cargas por segundo — mana resolvida.
    gear:
      - slot: weapon
        priorityPt: [Dano plano (Físico/Raio/Frio/Fogo), "% dano (Físico/Elemental)", "+nível de skills (Melee/Attack)", Chance de crítico, Dano crítico, Velocidade de ataque]
      - slot: body
        basesEn: [Evasion/Energy Shield]
        priorityPt: [Evasão/ES, Spirit, Vida, Resistências]
        notePt: Mais ES → priorize Ghost Dance + Convalescence; mais Evasão → Wind Dancer.
      - slot: amulet
        priorityPt: ["+nível de skills / skills melee", "ES/EV plano e %", Resistências, Spirit]
      - slot: ring
        priorityPt: [Dano plano (o máximo possível), Resistências, Raridade, Atributos]
    ascendancy:
      whenPt: 3ª ascensão (endgame)
      take: [hollow-focus-technique]
      notePt: O PoB do Scorpius (nível 79) tem Way of the Stonefist, Hollow Form Technique e Hollow Focus Technique.
    tree:
      pob: scorpius
      spec: Early Endgame
    treeNotesPt:
      - Weapon Set 1 (vermelho no guia) = cajado; Weapon Set 2 (verde) = talismã, com nodes de duração pro buff do Devour/Rend durar mais.
      - "Mana: se faltar, Efficiency II no Hollow Form, Sapphire com mana on kill ou Efficient Casting na árvore."
    howToPlayPt:
      - Segure Hollow Form em tudo. Hollow Focus é automático.
      - Devour nos cadáveres/sinos quando faltar carga; Rend sempre ativo.
    bossingPt:
      - Pounce no chefe (Mark for Death) → Rend → Frost Wall em volta (opcional) → Hollow Form.
    checklist:
      - Respec da árvore (PoB Scorpius · Early Endgame)
      - Cajado no Weapon Set 1, talismã no Weapon Set 2
      - 3ª ascensão → Hollow Focus Technique
      - Hollow Form + Whirling Assault + Mobility + Blindside + Magnified Area II
      - Hollow Focus + Magnified Area II + Culling Strike II + Blind II + Cooldown Recovery II
      - Auras — defensivas primeiro (Wind Dancer, Ghost Dance, Convalescence), depois Charge Regulation e Blasphemy
      - Filtro NeverSink 2-semi-strict (T1–5) → 3-strict a partir do T6

  # ---------------------------------------------------------------- ENDGAME
  - id: endgame
    levels: [80, 100]
    title: T12+ — upgrades de cajado e 4ª ascensão
    stagePt: Mapas T12+
    source: scorpius
    filter: t13
    summaryPt: >-
      Mesmo setup, agora escalando equipamento: perto do T12 troque o Nazir's por Duality ou um cajado raro bom.
      Hollow Form ganha um 5º suporte (Efficiency II ou Rakiata's Flow) e a 4ª ascensão entra.
    goalsPt:
      - Cajado — Duality ou rare (+nível de skills, dano plano, crítico).
      - 5º suporte no Hollow Form.
      - "4ª ascensão (ver verificação: guias divergem)."
    skills:
      - gem: hollow-form
        supports: [whirling-assault, mobility, blindside, magnified-area-ii, efficiency-ii]
        level: 20
        role: main
        notePt: "5º suporte: Efficiency II (barato, ajuda mana) ou Rakiata's Flow (mais caro). Futuro: Vorana's Siege no lugar do Magnified Area II."
        verify: Confirmar em que nível o Hollow Form ganha o 5º socket (Cliptis cita mais sockets no 65 e no 90).
      - gem: hollow-focus
        supports: [magnified-area-ii, culling-strike-ii, blind-ii, cooldown-recovery-ii]
        role: utility
      - gem: rend
        supports: [perpetual-charge, rapid-attacks-ii, prolonged-duration-ii, rage-iii]
        slotPt: Weapon Set 2 (Talismã)
        role: buff
      - gem: devour
        supports: [charge-profusion-ii, thrill-of-the-kill, prolonged-duration-i]
        slotPt: Weapon Set 2 (Talismã)
        role: utility
      - gem: pounce
        supports: [rapid-attacks-i, mark-for-death]
        slotPt: Weapon Set 2 (Talismã)
        role: movement
      - gem: frost-wall
        supports: [rapid-casting-ii, spell-cascade, glacier]
        role: boss
        optional: true
    spirit:
      - gem: wind-dancer
        supports: [maim, blind-i]
        role: defense
      - gem: ghost-dance
        supports: [cooldown-recovery-ii]
        role: defense
      - gem: convalescence
        supports: [prolonged-duration-ii, second-wind-iii, cooldown-recovery-i]
        role: defense
      - gem: charge-regulation
        supports: [clarity-i]
        role: buff
      - gem: blasphemy
        supports: [temporal-chains, slow-potency, magnified-area-i, focused-curse, ritualistic-curse]
        role: curse
    items:
      - item: duality
        whyPt: Upgrade de cajado perto do T12 (ou um rare forte). Aumento de dano grande.
      - item: farruls-rune-of-the-hunt
        whyPt: "Opcional: mais dano contra chefes e raros. Sobe o requisito do cajado pro nível 50."
      - item: lochtonial-caress
        required: true
        whyPt: Continua obrigatória.
    ascendancy:
      whenPt: 4ª ascensão (endgame)
      take: [runic-meridians]
      notePt: >-
        Barricade e Cliptis vão de Runic Meridians (5 sockets extras só de runa — fecha resistências).
        Alternativas citadas — Way of the Mountain ou Hollow Resonance Technique.
      verify: O guia do Scorpius não mostra a 4ª ascensão (o PoB é nível 79). Confirmar qual ele usa.
    tree:
      pob: scorpius
      spec: Early Endgame
    treeNotesPt:
      - Mesma árvore do Early Endgame; os pontos extras vão pra mais Evasão/ES e dano crítico conforme o equipamento.
    checklist:
      - Duality ou cajado raro
      - 5º suporte no Hollow Form
      - 4ª ascensão
      - Filtro NeverSink 4-very-strict a partir do T13

