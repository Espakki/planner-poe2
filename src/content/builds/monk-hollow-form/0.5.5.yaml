# Monk · Martial Artist · Hollow Form Whirling Assault — patch 0.5.5 (Forbidden Rites)
#
# Como ler este arquivo:
#  - Nomes de jogo em inglês; texto explicativo em PT-BR (campos terminados em Pt).
#  - Gemas, itens e passivas são referenciados por id (arquivos em src/content/entities/*).
#  - `verify:` / "# TODO verificar" = ponto que ainda não consegui confirmar nas fontes. Lista no fim do CLAUDE.md.
#  - Leveling (fases 1–5): guia escrito do Barricade/psynister (0.5.5), árvore do Build Planner por variante.
#  - Mapas/endgame (fases 6–7): guia do Scorpius (fonte da verdade), árvore do código PoB.

meta:
  slug: monk-hollow-form
  title: Hollow Form Whirling Assault
  taglinePt: Monk Martial Artist que vira "1 botão" — clones do Hollow Form girando com Whirling Assault e gerando as próprias cargas.
  class: Monk
  ascendancy: Martial Artist
  patch: "0.5.5"
  league: Forbidden Rites
  treeVersion: "0_5"
  lastVerified: 2026-11-07
  status: active
  summaryPt: >-
    A partir do nível 41 você coloca o Whirling Assault dentro do Hollow Form (skill da ascendência).
    Cada uso gasta Power Charges e invoca clones que giram por você. Com Lochtonial Caress + Way of the Stonefist,
    os clones devolvem cargas pra você — o ciclo se mantém sozinho. Até o 41, o leveling usa Falling Thunder
    com cargas de poder (Ato 1) e depois Storm Wave + Siphoning Strike com Hollow Palm Technique (sem arma).
  strengthsPt:
    - Praticamente 1 botão no endgame (Hollow Form + Whirling Assault).
    - Clear de tela inteira e bom dano em chefe com Rend + Mark for Death.
    - Barato pra começar — Lochtonial Caress e Amor Mandragora são drops comuns.
  weaknessesPt:
    - Frágil na campanha (principalmente no Ato 1).
    - Depende de Lochtonial Caress pra fechar o ciclo de cargas.
    - Precisa de bastante Spirit no endgame pras auras defensivas.
